name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python scripts/check_library.py
      - run: uv run python scripts/check_docs.py

  unit:
    name: Pytest unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -m "not integration" -q

  integration:
    name: Pytest integration (PostgreSQL)
    needs: [quality, unit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_runtime
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime
      AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration -q

  package:
    name: Build and import wheel
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - run: mkdir .package-check
      - name: Verify distribution and isolated core-only imports
        run: uv run --no-project python scripts/validate_core.py --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: core-import-evidence
          path: build/core-imports/
      - run: uv venv --python 3.12 .extras-venv
      - run: uv pip install --python .extras-venv/bin/python dist/*.whl "sqlalchemy[asyncio]" "psycopg[binary]" httpx
      - name: Verify optional component imports from the wheel
        working-directory: .package-check
        run: >-
          ../.extras-venv/bin/python -c
          "from agent_runtime.memory import PostgresMemoryStore;
          from agent_runtime.models_clients.anthropic import AnthropicModelClient;
          from agent_runtime.models_clients.gemini import GeminiModelClient;
          print(PostgresMemoryStore, AnthropicModelClient, GeminiModelClient)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  consumer:
    name: Independent wheel consumer (PostgreSQL)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_runtime_consumer
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime_consumer"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - name: Validate published baseline and record reliability gaps
        run: uv run python scripts/validate_consumer.py --report-dir build/consumer-baseline
      - run: uv build
      - name: Create a fresh candidate database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_fresh"); conn.close()'
      - name: Validate candidate wheel with the same downstream application
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_fresh
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --acceptance-only --frameworks \
            --soak-seconds 30 \
            --report-dir build/consumer-candidate
      - name: Verify migration preserves v0.1.1 records
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-baseline --acceptance-only \
            --report-dir build/consumer-upgrade
      - name: Create a v0.2.0 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v020"); conn.close()'
      - name: Preserve v0.2.0 data and ownership through the candidate upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v020
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.2.0 --acceptance-only --frameworks \
            --report-dir build/consumer-v020-upgrade
      - name: Verify provider contracts from the candidate wheel
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_providers.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --report-dir build/consumer-providers
      - name: Create a v0.3.0 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v030"); conn.close()'
      - name: Preserve v0.3.0 evidence through the candidate upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v030
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.3.0 --acceptance-only --frameworks \
            --report-dir build/consumer-v030-upgrade
      - name: Create a v0.3.1 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v031"); conn.close()'
      - name: Preserve published v0.3.1 state through upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v031
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.3.1 --acceptance-only --frameworks \
            --report-dir build/consumer-v031-upgrade
      - name: Create a v0.4.0 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v040"); conn.close()'
      - name: Preserve published v0.4.0 state through upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v040
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.4.0 --acceptance-only --frameworks \
            --report-dir build/consumer-v040-upgrade
      - name: Create a v0.4.1 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v041"); conn.close()'
      - name: Preserve published v0.4.1 state through upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v041
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.4.1 --acceptance-only --frameworks \
            --report-dir build/consumer-v041-upgrade
      - name: Create a v0.4.2 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v042"); conn.close()'
      - name: Preserve published v0.4.2 state through upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v042
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.4.2 --acceptance-only --frameworks \
            --report-dir build/consumer-v042-upgrade
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-consumer-results
          path: build/consumer-*/
          if-no-files-found: warn

  host-workload:
    name: Host workload smoke (${{ matrix.source }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workload
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d workload"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      WORKLOAD_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/workload
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Validate frozen actual v0.5.0 host baseline
        if: matrix.source == 'baseline'
        run: uv run --no-project python scripts/validate_workload.py --smoke --repetitions 1 --report-dir build/workload-smoke
      - name: Validate built wheel through the same host workload
        if: matrix.source == 'candidate'
        run: |
          uv build --wheel
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --no-project python scripts/validate_workload.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --smoke --repetitions 1 --report-dir build/workload-smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workload-smoke-${{ matrix.source }}
          path: build/workload-smoke/
          if-no-files-found: warn

  container:
    name: Container smoke test
    needs: [integration, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build app migrate
      - run: docker compose up -d --wait app postgres
      - run: python scripts/docker_smoke.py
      - run: python scripts/docker_shutdown_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
