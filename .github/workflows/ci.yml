name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  unit:
    name: Pytest unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -m "not integration" -q

  integration:
    name: Pytest integration (PostgreSQL)
    needs: [quality, unit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_runtime
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime
      AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration -q

  package:
    name: Build and import wheel
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - run: mkdir .package-check
      - run: uv venv --python 3.12 .core-venv
      - run: uv pip install --python .core-venv/bin/python dist/*.whl
      - name: Verify core imports with no optional dependencies
        working-directory: .package-check
        run: >-
          ../.core-venv/bin/python -c
          "from agent_runtime import AgentRuntime, RuntimeRequest, __version__;
          from agent_runtime.migrations import upgrade;
          print(__version__, AgentRuntime, RuntimeRequest)"
      - run: uv venv --python 3.12 .extras-venv
      - run: uv pip install --python .extras-venv/bin/python dist/*.whl "sqlalchemy[asyncio]" "psycopg[binary]" httpx
      - name: Verify optional component imports from the wheel
        working-directory: .package-check
        run: >-
          ../.extras-venv/bin/python -c
          "from agent_runtime.memory import PostgresMemoryStore;
          from agent_runtime.models_clients.anthropic import AnthropicModelClient;
          from agent_runtime.models_clients.gemini import GeminiModelClient;
          print(PostgresMemoryStore, AnthropicModelClient, GeminiModelClient)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  consumer:
    name: Independent wheel consumer (PostgreSQL)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_runtime_consumer
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime_consumer"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - name: Validate published baseline and record reliability gaps
        run: uv run python scripts/validate_consumer.py --report-dir build/consumer-baseline
      - run: uv build
      - name: Create a fresh candidate database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_fresh"); conn.close()'
      - name: Validate candidate wheel with the same downstream application
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_fresh
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --acceptance-only --frameworks \
            --soak-seconds 30 \
            --report-dir build/consumer-candidate
      - name: Verify migration preserves v0.1.1 records
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-baseline --acceptance-only \
            --report-dir build/consumer-upgrade
      - name: Create a v0.2.0 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v020"); conn.close()'
      - name: Preserve v0.2.0 data and ownership through the candidate upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v020
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.2.0 --acceptance-only --frameworks \
            --report-dir build/consumer-v020-upgrade
      - name: Verify provider contracts from the candidate wheel
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_providers.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --report-dir build/consumer-providers
      - name: Create a v0.3.0 upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_consumer_v030"); conn.close()'
      - name: Preserve v0.3.0 evidence through the candidate upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_consumer_v030
        run: |
          VERSION=$(uv run python -c 'import agent_runtime; print(agent_runtime.__version__)')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-release 0.3.0 --acceptance-only --frameworks \
            --report-dir build/consumer-v030-upgrade
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-consumer-results
          path: build/consumer-*/
          if-no-files-found: warn

  container:
    name: Container smoke test
    needs: [integration, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build app migrate
      - run: docker compose up -d --wait app postgres
      - run: python scripts/docker_smoke.py
      - run: python scripts/docker_shutdown_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
