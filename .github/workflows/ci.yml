name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: docker compose up -d postgres
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime
      - run: docker compose build app
      - run: docker compose run --rm migrate
      - run: docker compose up -d app postgres
      - run: uv run python scripts/docker_smoke.py
      - if: always()
        run: docker compose down -v
