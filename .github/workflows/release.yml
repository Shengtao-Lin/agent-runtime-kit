name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/releases/**"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_runtime
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime
      AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("agent-runtime-kit"))')" = "$GITHUB_REF_NAME"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  verify-container:
    name: Verify release container
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build app migrate
      - run: docker compose up -d --wait app postgres
      - run: python scripts/docker_smoke.py
      - run: python scripts/docker_shutdown_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

  verify-consumer:
    name: Verify release wheel and v0.1.1 upgrade
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_runtime_release_fresh
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime_release_fresh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_release_fresh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Validate the exact release wheel on an empty database
        run: |
          VERSION=$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("agent-runtime-kit"))')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --acceptance-only \
            --report-dir build/release-consumer-fresh
      - name: Create a separate upgrade database
        run: >-
          uv run python -c
          'import os, psycopg;
          conn = psycopg.connect(os.environ["AGENT_RUNTIME_TEST_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), autocommit=True);
          conn.execute("CREATE DATABASE agent_runtime_release_upgrade"); conn.close()'
      - name: Verify published v0.1.1 evidence survives the release upgrade
        env:
          AGENT_RUNTIME_TEST_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@localhost:5432/agent_runtime_release_upgrade
        run: |
          VERSION=$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("agent-runtime-kit"))')
          uv run python scripts/validate_consumer.py \
            --wheel "dist/agent_runtime_kit-$VERSION-py3-none-any.whl" \
            --expected-version "$VERSION" --upgrade-from-baseline --acceptance-only \
            --report-dir build/release-consumer-upgrade
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-consumer-results
          path: build/release-consumer-*/
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub release artifacts
    needs: [verify, verify-container, verify-consumer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Agent Runtime Kit $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Agent Runtime Kit $GITHUB_REF_NAME" --generate-notes
          fi

  publish-container:
    name: Publish container to GHCR
    needs: [verify, verify-container, verify-consumer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
