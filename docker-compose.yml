services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: agent_runtime
      POSTGRES_PASSWORD: agent_runtime
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_runtime -d agent_runtime"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent-runtime-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@postgres:5432/agent_runtime
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@postgres:5432/agent_runtime
      FAKE_MODEL: "true"
      OTEL_CAPTURE_CONTENT: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 25s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    profiles: ["observability"]

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    profiles: ["observability"]

volumes:
  agent-runtime-postgres:
