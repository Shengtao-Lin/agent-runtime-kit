[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-kit"
version = "0.1.0"
description = "A framework-neutral runtime toolkit for observable AI agents with PostgreSQL-backed memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shengtao Lin" }]
dependencies = [
  "opentelemetry-api>=1.27,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
postgres = ["alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "sqlalchemy[asyncio]>=2.0,<3"]
service = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn[standard]>=0.30,<1"]
openai-compatible = ["httpx>=0.27,<1"]
telemetry = [
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]
adapters = ["langchain-core>=0.3,<2", "langgraph>=0.2,<2"]
dev = [
  "pyright>=1.1.380",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a real PostgreSQL database"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
