[project]
name = "runtime-kit-history-validation"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "agent-runtime-kit[postgres] @ https://github.com/Shengtao-Lin/agent-runtime-kit/releases/download/v0.6.0/agent_runtime_kit-0.6.0-py3-none-any.whl",
  "psutil>=7.2,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
